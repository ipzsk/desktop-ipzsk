name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  # Keep required checks conclusive for documentation-only changes. Workflow
  # path filters can leave required checks pending, so classify inside the run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      product: ${{ steps.scope.outputs.product }}
    steps:
      - uses: actions/checkout@v6
        with:
          # GitHub's pull-request merge ref can retain the base branch's
          # submodule gitlink when the PR advances it to a descendant. Check
          # out the actual PR head so pinned submodules match upstream.json.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Classify changed paths
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node --test scripts/bilingual-docs.test.mjs
          node scripts/verify-bilingual-docs.mjs
          node --test scripts/market-dependency-direction.test.mjs
          node scripts/verify-market-dependency-direction.mjs
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            product=true
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
            product="$(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" | node scripts/classify-ci-changes.mjs)"
          fi
          echo "product=$product" >> "$GITHUB_OUTPUT"

  # Full product gate: build, typecheck, unit tests, and every headless smoke.
  # A documentation-only change already passed diff validation in `changes`.
  check:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only gate
        if: needs.changes.outputs.product == 'false'
        run: echo "Documentation-only change; product build and tests are not required."
      - uses: actions/checkout@v6
        if: needs.changes.outputs.product == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        if: needs.changes.outputs.product == 'true'
        with:
          node-version: 22.23.2
      - if: needs.changes.outputs.product == 'true'
        run: corepack enable
      - name: Resolve Yarn cache folder
        if: needs.changes.outputs.product == 'true'
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: needs.changes.outputs.product == 'true'
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - if: needs.changes.outputs.product == 'true'
        run: yarn install --immutable
      - if: needs.changes.outputs.product == 'true'
        run: yarn check

  # Windows-only logic and unsigned NSIS/portable builds on a real Windows runner:
  # updates, window options, pwsh sandbox, volume diagnostics, and packaging.
  # The package gate runs once; both artifacts reuse its build output.
  desktop-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [dsh-plugin-desktop, dsh-plugin-desktop-beta]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$env:GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace ${{ matrix.workspace }} check:win-package
      - name: Build Windows installer
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace ${{ matrix.workspace }} dist:win
      - name: Build Windows portable archive
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace ${{ matrix.workspace }} dist:win-portable
      - name: Upload Windows packages
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.workspace }}-windows-x64
          path: |
            ${{ matrix.workspace }}/dist/*-Setup.exe
            ${{ matrix.workspace }}/dist/*-Portable.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Sign and notarize master builds only after the complete headless gate.
  # Pull requests and dispatches on other branches keep the unsigned smoke.
  desktop-macos:
    needs: [changes, check]
    if: needs.changes.outputs.product == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        workspace: [dsh-plugin-desktop, dsh-plugin-desktop-beta]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - name: Resolve Yarn cache folder
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.yarnrc.yml') }}
      - run: yarn install --immutable
      - run: yarn workspace ${{ matrix.workspace }} check:mac-package
      - name: Build macOS smoke artifact
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
        run: yarn workspace ${{ matrix.workspace }} dist:mac-smoke
      - name: Upload unsigned macOS package
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.workspace }}-macos-universal-unsigned
          path: ${{ matrix.workspace }}/dist/mac-smoke/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Sign and notarize macOS package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: bash
        env:
          DSH_PACKAGE_CHECK_ALREADY_RAN: '1'
          DESKTOP_WORKSPACE: ${{ matrix.workspace }}
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ runner.temp }}/desktop-notary-key.p8
        run: |
          set -euo pipefail
          umask 077
          : "${MAC_CERT_P12_BASE64:?Missing MAC_CERT_P12_BASE64 secret}"
          : "${CSC_KEY_PASSWORD:?Missing CSC_KEY_PASSWORD secret}"
          : "${MACOS_SIGN_IDENTITY:?Missing MACOS_SIGN_IDENTITY secret}"
          : "${APPLE_API_KEY_BASE64:?Missing APPLE_API_KEY_BASE64 secret}"
          : "${APPLE_API_KEY_ID:?Missing APPLE_API_KEY_ID secret}"
          : "${APPLE_API_ISSUER:?Missing APPLE_API_ISSUER secret}"
          trap 'rm -f "$APPLE_API_KEY"' EXIT
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(process.env.APPLE_API_KEY, Buffer.from(process.env.APPLE_API_KEY_BASE64, "base64"), { mode: 0o600 });'
          unset APPLE_API_KEY_BASE64
          umask 022
          yarn workspace "$DESKTOP_WORKSPACE" dist:mac
          unset MAC_CERT_P12_BASE64 CSC_KEY_PASSWORD MACOS_SIGN_IDENTITY
          for dmg in "$DESKTOP_WORKSPACE"/dist/mac-release/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --output-format json > "$dmg.notarization.json"
            node --input-type=module -e 'import { readFileSync } from "node:fs"; const result = JSON.parse(readFileSync(process.argv[1], "utf8")); if (result.status !== "Accepted") throw new Error("DMG notarization failed: " + result.status + " (" + result.id + ")"); console.log("DMG notarization Accepted: " + result.id);' "$dmg.notarization.json"
            xcrun stapler staple "$dmg"
            codesign --verify --strict --verbose=2 "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
            xcrun stapler validate "$dmg"
            (cd "$(dirname "$dmg")" && shasum -a 256 "$(basename "$dmg")") > "$dmg.sha256"
          done
      - name: Remove notarization private key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/desktop-notary-key.p8"
      - name: Upload signed macOS package
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.workspace }}-macos-universal-signed
          path: |
            ${{ matrix.workspace }}/dist/mac-release/*.dmg
            ${{ matrix.workspace }}/dist/mac-release/*.dmg.sha256
            ${{ matrix.workspace }}/dist/mac-release/*.dmg.notarization.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  # Upstream toolchain smoke: the portable-shell scripts must resolve the
  # pinned submodule's own Yarn/pnpm release on Windows.
  upstream-command-windows:
    needs: changes
    if: needs.changes.outputs.product == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - run: corepack enable
      - run: yarn check:layout
      - run: yarn upstream:version
